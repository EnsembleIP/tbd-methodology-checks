name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

jobs:
  methodology-checks:
    name: Methodology Checks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TBD Methodology Checks
        uses: ./
  validate-structure:
    name: Validate Repository Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check action.yml exists
        run: |
          if [ ! -f "action.yml" ]; then
            echo "❌ Error: action.yml file not found in repository root"
            exit 1
          fi
          echo "✅ action.yml file exists"

  lint-yaml:
    name: lint-yaml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: |
          echo "Linting all YAML files..."
          yamllint -f colored .

  ci-pass:
    name: CI Pass
    needs: [methodology-checks, validate-structure, lint-yaml]
    runs-on: ubuntu-latest
    steps:
      - name: Pass CI
        run: echo "CI passed"
