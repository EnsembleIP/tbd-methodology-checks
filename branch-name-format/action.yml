name: "TBD Methodology Checks - Branch Name Format"
description: "Validates branch names in PRs. Ensures branch names follow the pattern (bug|story|task|spike)/QD-{number}-{description}. Posts PR comments for violations."
author: "EnsembleIP"

inputs:
  branch-pattern:
    description: "Regular expression pattern for validating branch name format."
    required: true
  comment-marker:
    description: "HTML comment marker to identify comments created by this action."
    required: false
    default: "<!-- branch-name-format-action -->"

runs:
  using: "composite"
  steps:
    - name: Validate branch name
      id: validate-branch
      if: github.event.pull_request
      uses: actions/github-script@v7
      env:
        BRANCH_PATTERN: ${{ inputs.branch-pattern }}
        COMMENT_MARKER: ${{ inputs.comment-marker }}
      with:
        script: |
          const branchPattern = new RegExp(process.env.BRANCH_PATTERN);
          const branchName = context.payload.pull_request.head.ref;
          const msgMarker = process.env.COMMENT_MARKER;
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const prNumber = context.payload.pull_request.number;

          core.info(`Validating branch name: ${branchName}`);

          const isValid = branchPattern.test(branchName);
          // Find and delete existing comment from this action
          const { data: comments } = await github.rest.issues.listComments({
            owner,
            repo,
            issue_number: prNumber,
            per_page: 100
          });

          const existingComment = comments.find(comment =>
            comment.body && comment.body.includes(msgMarker)
          );

          if (isValid) {
            if (existingComment) {
              // Delete previous comment
              await github.rest.issues.deleteComment({
                owner,
                repo,
                comment_id: existingComment.id
              });
              core.info("Previous PR comment removed.");
            }
            core.info("✅ Branch name follows the required format!");
          } else {
            // Build comment body
            let commentBody = `${msgMarker}\n### ❌ Branch Name Validation Failed\n\n`;
            commentBody += `Branch name \`${branchName}\` does not match the required pattern.\n\n`;
            commentBody += `**Required pattern:** \`${process.env.BRANCH_PATTERN}\`\n\n`;
            commentBody += `**Examples of valid branch names:**\n`;
            commentBody += `- \`bug/QD-1234-fix-login-issue\`\n`;
            commentBody += `- \`story/QD-456-add-user-dashboard\`\n`;
            commentBody += `- \`task/QD-789-update-dependencies\`\n`;
            commentBody += `- \`spike/QD-321-research-new-api\`\n\n`;

            // Create or update comment
            if (existingComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body: commentBody
              });
              core.info("Existing comment updated.");
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: commentBody
              });
              core.info("New comment created.");
            }

            // Fail the action
            core.setFailed('Branch name validation failed');
          }
